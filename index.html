<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#087f58" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Saraga" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SARAGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      html { background: #e8eeeb; }
      html[data-theme='dark'] { background: #0c1411; }
      /* layar pembuka: aturan yang sama juga ada di src/index.css (dipakai React) */
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #e8eeeb; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      html[data-theme='dark'] .boot { background: #0c1411; }
      .boot b {
        display: grid; place-items: center; width: 96px; height: 96px; border-radius: 24px;
        background: #087f58; color: #fff; font: 800 52px/1 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      html[data-theme='dark'] .boot b { background: #34d399; color: #05261b; }
      .boot strong { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.06em; color: #13202b; }
      html[data-theme='dark'] .boot strong { color: #e8f1ed; }
      .boot span { font-size: 0.9rem; font-weight: 500; color: #566274; }
      html[data-theme='dark'] .boot span { color: #93a69e; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><b>S</b><strong>SARAGA</strong><span>Memuat…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
